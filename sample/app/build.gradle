plugins {
    alias(libs.plugins.starter.application.android)
    alias(libs.plugins.app.cash.licensee)
    id("io.github.usefulness.licensee-for-android")
    alias(libs.plugins.starter.easylauncher)
    alias(libs.plugins.kotlin.compose.compiler)
}

licensee {
    allow("Apache-2.0")
}

licenseeForAndroid {
    enableKotlinCodeGeneration = true
    enableResourceGeneration = true
}

def licenseeArtifactsElements = configurations.consumable("licenseeArtifactsElements") {
    attributes.attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, "licensee-artifacts"))
}
androidComponents.onVariants(androidComponents.selector().withName("debug")) {
    licenseeArtifactsElements.configure {
        outgoing.artifact(tasks.named("licenseeAndroidDebug").flatMap { it.outputDir.file("artifacts.json") })
    }
}
android {
    namespace = "io.githhub.usefulness.licensee.android.app"
    // androidx.compose 1.13+ requires compileSdk 37.1, which gradle-starter's integer-only `compileSdkVersion` can't express
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId = "io.githhub.usefulness.licensee.android.app"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        named("debug") {
            storeFile isolated.rootProject.projectDirectory.file("keys/debug.keystore").asFile
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }
    buildTypes {
        named("debug") {
            signingConfig = signingConfigs.getByName("debug")
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        named("release") {
            minifyEnabled = true
            signingConfig = signingConfigs.getByName("debug")
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            matchingFallbacks += ["debug"]
        }
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    lint {
        checkReleaseBuilds = false
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Robolectric 4.17+ reflects into jdk.internal.access on JDK 17+, see https://robolectric.org/getting-started/
    jvmArgs("--add-opens=java.base/jdk.internal.access=ALL-UNNAMED")
}

dependencies {
    implementation(platform(libs.androidx.compose.bom))
    implementation(libs.androidx.core.core.ktx)
    implementation(libs.lifecycle.runtime.ktx)
    implementation(libs.activity.compose)
    implementation(libs.ui)
    implementation(libs.ui.graphics)
    implementation(libs.material3)
    implementation(libs.androidx.compose.material.material.icons.extended)

    implementation(project(":ui"))

    //noinspection UseTomlInstead, see `PluginIntegrationTest`
    debugImplementation("androidx.viewpager2:viewpager2:1.1.0")
    debugImplementation(libs.ui.tooling.preview)

    testRuntimeOnly(libs.junit.platform.launcher)
    testRuntimeOnly(libs.junit.vintage.engine)

    testImplementation(libs.junit4)
    testImplementation(libs.assertj.core)
    testImplementation(libs.androidx.test.core)
    testImplementation(libs.org.robolectric.core)
    testImplementation(libs.kotlinx.serialization.json.okio)
}
